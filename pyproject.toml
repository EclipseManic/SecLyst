[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: starts all five copied engines",
]

[tool.ruff]
target-version = "py311"
line-length = 120

# The copied engine internals are vendored analysis code and are not held to the
# platform's lint standard. Roughly three hundred pre-existing findings there
# would mask a real one in the platform code. `scripts/verify.py` lints the
# engine files that were adapted for Seclyst by naming them explicitly, and
# explicit paths are still checked, so the contract surface stays gated.
exclude = [
    "engines/*/app/**",
    "engines/*/core/**",
    "engines/*/modules/**",
    "engines/*/engine/**",
    "engines/*/ui/**",
    "engines/*/web/**",
    "engines/*/tests/**",
    "engines/*/test/**",
    "engines/*/scripts/**",
]
