name: Bug report
description: Something in the platform or an engine does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check `runtime/logs/<tool>.log` for the affected engine and
        search existing issues.

        Do **not** report a security vulnerability here. Use the private advisory
        link in the issue chooser instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Seclyst is affected?
      options:
        - Workbench shell
        - IOC Lookup
        - Malware Analyzer
        - Event Analyzer
        - Phishing Detector
        - RuleForge
        - Platform API, jobs, or artifacts
        - Authentication or settings
        - Setup, install, or build
        - Documentation
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The behaviour you saw, including the exact error text if there was one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `python run.py`
        2. Open ...
        3. Upload ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste from `runtime/logs/<tool>.log` or the terminal. Remove anything sensitive first.
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Node version, browser.
      placeholder: Windows 11, Python 3.13.2, Node 22.11, Chrome 131
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I am not reporting a crash caused by a deliberately malformed sample unless it escaped the engine process.
          required: false
