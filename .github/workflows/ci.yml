name: Seclyst CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            engines/ioc/ui/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install and build interfaces
        run: python scripts/setup.py --skip-python
      - name: Verify platform and engines
        run: python scripts/verify.py
