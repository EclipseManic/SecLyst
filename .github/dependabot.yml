version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-toolchain:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/engines/ioc/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ioc-ui-toolchain:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
